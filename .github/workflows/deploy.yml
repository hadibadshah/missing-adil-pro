name: Deploy MissingAdil Store to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger public_html
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Build Production Assets
        run: npm run build

      - name: 📂 Verify Build Directory Output
        run: ls -la dist/

      - name: 🚀 Sync & Deploy to Hostinger public_html via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}       # e.g., ftp.missingadil.store or Hostinger IP
          username: ${{ secrets.FTP_USERNAME }}     # Your Hostinger FTP Username
          password: ${{ secrets.FTP_PASSWORD }}     # Your Hostinger FTP Password
          port: 21                                  # Port 21 for FTP or 22 for SFTP
          local-dir: ./dist/                        # Upload compiled dist files
          server-dir: /public_html/                 # Hostinger web root directory
          dangerous-clean-slate: false              # Prevent deleting unrelated server files
